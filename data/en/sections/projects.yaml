projects:
- name: DTV Autonomous Platform & Sensor Fusion Stack
  image: /images/sections/projects/dtv.png
  role: Robotics & Control Engineer
  timeline: "Nov 2024 - Jan 2026"
  summary:
    Developed an end-to-end autonomy stack for the DTV Shredder, integrating perception,
    localization, human interaction, and safety systems on an NVIDIA Jetson platform.
    Implemented multi-sensor fusion using ultrasonic sensing, stereo VSLAM, and UWB
    anchors to provide drift-reduced state estimation through an Extended Kalman Filter.
    Deployed real-time vision pipelines using YOLO and DeepStream for person detection,
    tracking, and autonomous following behaviors. Built a natural-language command
    interface using a quantized language model to translate user instructions into
    executable robot actions. Optimized the full pipeline for embedded real-time
    performance with system-level validation and data logging.
  tags: ["professional", "robotics", "highlight"]

- name: Tracked Vehicle Steering & Control System
  role: Control Algorithm Developer
  timeline: "May 2021 - Jan 2025"
  summary:
    Designed and implemented the differential steering control system for the DTV
    Shredder tracked vehicle. Developed and tuned PID and Model Predictive Control
    (MPC) algorithms to address nonlinear steering behavior and terrain-dependent
    disturbances. Applied Extended Kalman Filtering to improve state estimation
    robustness under sensor noise and slip conditions. Built a joystick-based remote
    controller and demonstration routines to validate maneuverability and control
    responsiveness. The system significantly improved low-speed stability and operator
    control precision.
  tags: ["professional", "robotics", "highlight"]

- name: Vision-Based Object Tracking for Differential Drive Robot
  image: /images/sections/projects/person_recognition.png
  role: Robotics Developer
  timeline: "Jun 2025 - Present"
  summary:
    Developed a real-time vision tracking system for a differential drive robot using
    a YOLO-based detector running on NVIDIA Jetson Orin NX. Integrated Kalman filtering
    and motion control to maintain smooth target following at a fixed distance.
    Implemented closed-loop velocity control to reduce oscillation and improve tracking
    stability under dynamic target motion. The system demonstrates robust real-time
    perception-to-control integration for mobile robotics applications.
  tags: ["professional", "robotics", "cv", "highlight"]

- name: DTV Simulation Environment (ROS2 & Gazebo)
  role: Developer
  timeline: "Aug 2024 - Oct 2024"
  summary:
    Built a high-fidelity simulation environment for the DTV Shredder using ROS2 and
    Gazebo to support rapid prototyping and algorithm validation. Modeled tracked
    vehicle kinematics and sensor interfaces to enable testing of navigation,
    perception, and control modules in a repeatable virtual environment. The simulator
    accelerated development cycles and reduced on-hardware testing risk.

  tags: ["hobby", "ros2"]
  
- name: Pressure Measuring System for Golf Simulator
  image: /images/sections/projects/pressure_mat.png
  role: Team Lead
  timeline: "Oct 2024 - Jun 2025"
  summary: This project involves a pressure mat that captures weight distribution to calculate center of weight movement, analyzing golf swing quality for training. It provides feedback on posture, balance, and movement to help golfers improve technique and performance. 
  tags: ["hobby", "highlight"]
  
- name: Golf Putting Sensor
  image: /images/sections/projects/golf_putter.png
  role: Team Lead
  timeline: "Sep 2025 - Present"
  summary: This project involves a MPU6050, a RP2040 dev board and a LED matrix board. An algorithm was developed to detect the speed and acceleration of a golf club for putting exercise.
  tags: ["hobby"]
  
- name: UR5 Robot Arm Pick & Place
  role: Developer
  timeline: "Aug 2024 - Oct 2024"
  summary: Use ROS2 and Gazebo to simulate an UR5 robot arm to complete a pick & place task.
  tags: ["hobby", "ros"]

- name: Reach‑Avoid Control Synthesis for a Quadrotor UAV
  image: /images/sections/projects/crazyflie.png
  role: Team Lead
  timeline: "Sep 2023 - Apr 2024"
  url: "https://www.youtube.com/watch?v=wMMqXJsCATg"
  summary: A framework was designed to create a safe trajectory for UAVs to reach targets in complex environments, avoiding obstacles while meeting velocity and thrust constraints. It combined geometric controller for precise tracking with Bézier curve-based trajectory generation, incorporating tracking errors.
  tags: ["academic", "quadrotor"]

- name: Signal Temporal Logic Motion Planning for Quadrotor
  role: Team Lead
  timeline: "Mar 2023 - Aug 2023"
  summary: A framework was constructed for robust quadrotor reach-avoid tasks using signal temporal logic (STL) and geometric control theory. Mixed-integer convex programming (MICP) is used to satisfy STL specifications, producing smooth trajectories with robustness tubes. A Lyapunov-based geometric controller ensures the quadrotor follows the trajectory within the robustness tube. Simulations confirm the framework's effectiveness, and comparisons show it outperforms PID and nonlinear model predictive control (NMPC).
  tags: ["academic", "quadrotor"]

- name: Geometric Control of a Quadrotor UAV on SE(3)
  role: Owner
  timeline: "Sep 2022 - Dec 2022"
  summary: This projects introduces a tracking controller for a quadrotor using geometric control based on work by Lee et al. (2010). Leveraging SE(3) properties, this approach achieves a robust, coordinate-free control performance.
  tags: ["academic", "quadrotor"]
  
- name: Optimal Control Formulation of Deep Neural Network
  role: Owner
  timeline: "Jan 2022 - Mar 2022"
  summary: An Optimal control formulation of deep neural networks based on Li et al. (2018).
  tags: ["academic"]

- name: Harmonic Drive Based Equatorial Mount
  image: /images/sections/projects/harmonic_drive.png
  role: Owner
  timeline: "Jun 2025 - Jan 2026"
  summary: Built a robust telescope equatorial mount using two harmonic drives, achieving 15kg+ loading capacity. A Onstep controller and SHC controller were built together to drive the mount.
  tags: ["hobby", "highlight"]
  
- name: Onstep Motor Controller
  image: /images/sections/projects/onstep.png
  role: Owner
  timeline: "Jun 2025 - Aug 2025"
  summary: Modified and Soldered Onstep Motor Controller PCB for my harmonic equatorial mount. KiCAD and JLCPCB service are used.
  tags: ["hobby"]

