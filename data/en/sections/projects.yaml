projects:
- name: DTV Sensor Fusion System
  image: /images/sections/projects/dtv.png
  timeline: "Apr 2025 - Jan 2026"
  summary:  Implemented ultrasonic sensing for real‑time obstacle detection to ensure operational safety.
   Integrated VSLAM to provide real‑time pose estimation and drift‑reduced odometry updates to the EKF.
   Used UWB anchors as global position constraints to improve localization robustness in indoor environments.
   Applied YOLOv11 with DeepStream for real‑time person detection enabling person‑following mode.
   Deployed and optimized the full pipeline on NVIDIA Jetson for real‑time embedded operation and data logging.
  tags: ["professional", "dtv", "highlight"]

- name: Autonomous Safety & Obstacle Avoidance System
  role: Developer
  timeline: "Apr 2025 - May 2025"
  summary: Integrated ultrasonic sensors to provide collision avoidance. The system monitors surroundings and automatically stops the vehicle when obstacles are detected nearby.
  tags: ["professional", "dtv", "highlight"]
  
- name: Vision-Based Person Recognition 
  image: /images/sections/projects/person_recognition.png
  role: Developer
  timeline: "Jul 2025 - Aug 2025"
  summary: Deployed a YOLO model on the Jetson Orin NX to recognize and track people in real time. Enabled the vehicle to identify and react to human presence.
  tags: ["professional", "dtv"]
  
- name: DTV Shredder Tracking & Following System
  role: Developer
  timeline: "Aug 2025 - Present"
  summary: mplemented a UWB positioning system to locate and follow a designated person. Combined with control logic, the vehicle can autonomously trail a target.
  tags: ["professional", "dtv"]
  
- name: Natural Language Command Interface
  role: Developer
  timeline: "Aug 2025 - Present"
  summary: Ran a quantized language model on the Jetson Orin NX to parse spoken or written user commands. Enabled intuitive communication between user and robot by translating words into actionable tasks.
  tags: ["professional", "dtv"]

- name: DTV Shredder Remote Controller
  role: Developer
  timeline: "Nov 2024 - Present"
  summary: A joystick-based remote controller is designed for the DTV Shredder to enable precise control. Additionally, a showcase routine was created to demonstrate the shredder's maneuverability.
  tags: ["professional", "dtv"]
  
- name: Pressure Measuring System for Golf Simulator
  image: /images/sections/projects/pressure_mat.png
  role: Team Lead
  timeline: "Oct 2024 - Jun 2025"
  summary: This project involves a pressure mat that captures weight distribution to calculate center of weight movement, analyzing golf swing quality for training. It provides feedback on posture, balance, and movement to help golfers improve technique and performance. 
  tags: ["hobby", "highlight"]
  
- name: Golf Putting Sensor
  image: /images/sections/projects/golf_putter.png
  role: Team Lead
  timeline: "Sep 2025 - Present"
  summary: This project involves a MPU6050, a RP2040 dev board and a LED matrix board. An algorithm was developed to detect the speed and acceleration of a golf club for putting exercise.
  tags: ["hobby"]
  
- name: UR5 Robot Arm Pick & Place
  role: Developer
  timeline: "Aug 2024 - Oct 2024"
  summary: Use ROS2 and Gazebo to simulate an UR5 robot arm to complete a pick & place task.
  tags: ["hobby", "ros"]
  
- name: DTV Simulator
  role: Developer
  timeline: "Aug 2024 - Oct 2024"
  summary: A DTV Shredder simulator was designed using ROS2 and Gazebo. 
  tags: ["hobby", "dtv", "ros"]
  
- name: DTV Shredder Steering System
  role: Developer
  timeline: "May 2021 - Aug 2021"
  summary: This project involved designing the steering control system for the DTV Shredder. Advanced mathematical algorithms, such as PID and Model Predictive Control (MPC), were implemented to address steering challenges specific to tracked vehicles. An Extended Kalman Filter (EKF) was also applied in signal processing to effectively filter out environmental noise, enhancing control precision and system reliability.
  tags: ["professional", "dtv", "highlight"]

- name: Reach‑Avoid Control Synthesis for a Quadrotor UAV
  role: Team Lead
  timeline: "Sep 2023 - Apr 2024"
  url: "https://www.youtube.com/watch?v=wMMqXJsCATg"
  summary: A framework was designed to create a safe trajectory for UAVs to reach targets in complex environments, avoiding obstacles while meeting velocity and thrust constraints. It combined geometric controller for precise tracking with Bézier curve-based trajectory generation, incorporating tracking errors.
  tags: ["academic", "quadrotor"]

- name: Signal Temporal Logic Motion Planning for Quadrotor
  role: Team Lead
  timeline: "Mar 2023 - Aug 2023"
  summary: A framework was constructed for robust quadrotor reach-avoid tasks using signal temporal logic (STL) and geometric control theory. Mixed-integer convex programming (MICP) is used to satisfy STL specifications, producing smooth trajectories with robustness tubes. A Lyapunov-based geometric controller ensures the quadrotor follows the trajectory within the robustness tube. Simulations confirm the framework's effectiveness, and comparisons show it outperforms PID and nonlinear model predictive control (NMPC).
  tags: ["academic", "quadrotor"]

- name: Geometric Control of a Quadrotor UAV on SE(3)
  role: Owner
  timeline: "Sep 2022 - Dec 2022"
  summary: This projects introduces a tracking controller for a quadrotor using geometric control based on work by Lee et al. (2010). Leveraging SE(3) properties, this approach achieves a robust, coordinate-free control performance.
  tags: ["academic", "quadrotor"]
  
- name: Optimal Control Formulation of Deep Neural Network
  role: Owner
  timeline: "Jan 2022 - Mar 2022"
  summary: An Optimal control formulation of deep neural networks based on Li et al. (2018).
  tags: ["academic"]
  
- name: ELRS Remote Controller
  role: Developer
  timeline: "Oct 2025 - Jan 2026"
