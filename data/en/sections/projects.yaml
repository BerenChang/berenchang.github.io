projects:
- name: DTV Autonomous Platform & Sensor Fusion Stack
  image: /images/sections/projects/dtv.png
  role: Robotics & Control Engineer
  timeline: "Nov 2024 - Jan 2026"
  summary:
    Developed an end-to-end autonomy stack for the DTV Shredder, integrating perception,
    localization, human interaction, and safety systems on an NVIDIA Jetson platform.
    Implemented multi-sensor fusion using ultrasonic sensing, stereo VSLAM, and UWB
    anchors to provide drift-reduced state estimation through an Extended Kalman Filter.
    Deployed real-time vision pipelines using YOLO and DeepStream for person detection,
    tracking, and autonomous following behaviors. Built a natural-language command
    interface using a quantized language model to translate user instructions into
    executable robot actions. Optimized the full pipeline for embedded real-time
    performance with system-level validation and data logging.
  tags: ["professional", "robotics", "highlight"]

- name: Tracked Vehicle Steering & Control System
  role: Control Algorithm Developer
  timeline: "May 2021 - Jan 2025"
  summary:
    Designed and implemented the differential steering control system for the DTV
    Shredder tracked vehicle. Developed and tuned PID and Model Predictive Control
    (MPC) algorithms to address nonlinear steering behavior and terrain-dependent
    disturbances. Applied Extended Kalman Filtering to improve state estimation
    robustness under sensor noise and slip conditions. Built a joystick-based remote
    controller and demonstration routines to validate maneuverability and control
    responsiveness. The system significantly improved low-speed stability and operator
    control precision.
  tags: ["professional", "robotics", "embedded", "highlight"]

- name: Vision-Based Object Tracking for Differential Drive Robot
  image: /images/sections/projects/person_recognition.png
  role: Robotics Developer
  timeline: "Jun 2025 - Present"
  summary:
    Developed a real-time vision tracking system for a differential drive robot using
    a YOLO-based detector running on NVIDIA Jetson Orin NX. Integrated Kalman filtering
    and motion control to maintain smooth target following at a fixed distance.
    Implemented closed-loop velocity control to reduce oscillation and improve tracking
    stability under dynamic target motion. The system demonstrates robust real-time
    perception-to-control integration for mobile robotics applications.
  tags: ["professional", "robotics", "cv", "highlight"]

- name: DTV Simulation Environment (ROS2 & Gazebo)
  role: Developer
  timeline: "Aug 2024 - Oct 2024"
  summary:
    Built a high-fidelity simulation environment for the DTV Shredder using ROS2 and
    Gazebo to support rapid prototyping and algorithm validation. Modeled tracked
    vehicle kinematics and sensor interfaces to enable testing of navigation,
    perception, and control modules in a repeatable virtual environment. The simulator
    accelerated development cycles and reduced on-hardware testing risk.
  tags: ["hobby", "ros2"]

- name: Golf Biomechanics Sensing Suite
  image: /images/sections/projects/pressure_mat.png
  role: Team Lead
  timeline: "Oct 2024 - Present"
  summary:
    Led the development of a multi-sensor golf training system combining a large-area
    pressure sensing mat and an IMU-based putting analyzer to evaluate swing mechanics
    and balance. Designed a flexible 1m × 2m pressure mat to capture real-time weight
    distribution and compute center-of-pressure trajectories for swing quality
    assessment. Developed embedded algorithms on RP2040 with MPU6050 to estimate club
    speed and acceleration during putting exercises, with LED matrix feedback for
    intuitive training. The integrated system provides quantitative feedback on
    posture, balance, and stroke consistency for golf performance improvement.
  tags: ["hobby", "embedded", "highlight"]

- name: Reach-Avoid & STL Quadrotor Control Framework
  image: /images/sections/projects/crazyflie.png
  role: Team Lead
  timeline: "Sep 2022 - Apr 2024"
  url: "https://www.youtube.com/watch?v=wMMqXJsCATg"
  summary:
    Developed a formal methods–based motion planning and control framework for
    quadrotor UAVs operating in constrained environments. Formulated reach-avoid tasks
    using Signal Temporal Logic (STL) and solved trajectory generation via
    mixed-integer convex programming (MICP) with Bézier curve parameterization to
    ensure dynamic feasibility. Designed a Lyapunov-stable geometric controller on
    SE(3) for high-precision trajectory tracking under thrust and velocity
    constraints. Simulation studies demonstrated improved robustness and tracking
    performance compared with PID and nonlinear MPC baselines.
  tags: ["academic", "robotics", "highlight"]

- name: Harmonic-Drive Equatorial Telescope Mount
  image: /images/sections/projects/harmonic_drive.png
  role: System Designer
  timeline: "Jun 2025 - Jan 2026"
  summary:
    Designed and built a high-precision equatorial telescope mount using dual harmonic
    drive reducers to achieve high torque density and sub-arcminute tracking
    capability. Integrated stepper motors with planetary pre-reduction and implemented
    an OnStep-based control system running on Teensy 4.0 with an ESP32 Smart Hand
    Controller (SHC). Customized and soldered the motor controller PCB using KiCad and
    JLCPCB to support the mount’s electrical and EMI requirements. The system supports
    payloads exceeding 15 kg and enables stable long-exposure astrophotography.
  tags: ["hobby", "embedded", "highlight"]

- name: UR5 Pick-and-Place Simulation (ROS2 & Gazebo)
  role: Developer
  timeline: "Aug 2024 - Oct 2024"
  summary:
    Implemented a ROS2-based manipulation pipeline for a UR5 robot arm in Gazebo.
    Developed motion planning and grasp execution for autonomous pick-and-place
    operations within a simulated workspace. The project demonstrates familiarity with
    ROS2 manipulation workflows and robotic arm kinematics in a physics-based
    environment.
  tags: ["hobby", "ros2"]

- name: Optimal Control Formulation of Deep Neural Networks
  role: Researcher
  timeline: "Jan 2022 - Mar 2022"
  summary:
    Studied the optimal control interpretation of deep neural networks following the
    framework of Li et al. (2018). Analyzed the correspondence between residual
    networks and discretized dynamical systems, and explored training dynamics through
    the lens of continuous-time optimal control. The work strengthened theoretical
    understanding of learning-based control and deep model stability.
  tags: ["academic"]
